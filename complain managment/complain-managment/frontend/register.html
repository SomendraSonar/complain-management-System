<!DOCTYPE html>
<html>

<head>

<title>Register</title>

</head>

<body>

<h1>User Registration</h1>

<input
id="name"
placeholder="Name">

<br><br>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<br><br>

<button onclick=
"register()">

Register

</button>

<script>

async function register(){

const data={

name:
document.getElementById(
"name").value,

email:
document.getElementById(
"email").value,

password:
document.getElementById(
"password").value

};

await fetch(
"http://localhost:8080/api/auth/register",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(data)

});

alert(
"Registration Successful");

}

</script>

</body>

</html>
