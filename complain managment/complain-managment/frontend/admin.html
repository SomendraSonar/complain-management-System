<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
margin:0;
}

nav{
background:#1f1f1f;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

nav a{
color:white;
text-decoration:none;
margin-right:25px;
font-size:18px;
}

nav button{
float:right;
padding:8px 15px;
cursor:pointer;
}

.stats{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:30px;
}

.stat-card{
background:white;
width:180px;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px gray;
text-align:center;
}

.number{
font-size:35px;
font-weight:bold;
}

input,select,textarea{

padding:10px;
margin:10px;

}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0px 2px 8px gray;
}

img{

margin-top:10px;
border-radius:10px;

}

button{
padding:10px;
margin:5px;
cursor:pointer;
}

</style>

</head>

<body>

<script>

if(
localStorage.getItem(
"role"
)!=="ADMIN"
){
window.location=
"login.html";
}

</script>

<nav>

<a href="index.html">
Create Complaint
</a>

<a href="mycomplaints.html">
My Complaints
</a>

<a href="admin.html">
Dashboard
</a>

<button onclick=
"logout()">
Logout
</button>

</nav>

<h1>Admin Dashboard</h1>

<div class="stats">

<div class="stat-card">
<h3>Total</h3>
<div class="number" id="total">0</div>
</div>

<div class="stat-card">
<h3>Pending</h3>
<div class="number" id="pending">0</div>
</div>

<div class="stat-card">
<h3>In Progress</h3>
<div class="number" id="progress">0</div>
</div>

<div class="stat-card">
<h3>Resolved</h3>
<div class="number" id="resolved">0</div>
</div>

</div>

<input
id="search"
placeholder="Search">

<select
id="statusFilter">

<option value="">
All
</option>

<option value="Pending">
Pending
</option>

<option value="In Progress">
In Progress
</option>

<option value="Resolved">
Resolved
</option>

</select>

<div id="complaints">

Loading...

</div>

<script>

function logout(){

localStorage.clear();

window.location=
"login.html";

}

async function sendResponse(id){

const response=

document
.getElementById(
`response${id}`
)
.value;

await fetch(

`http://localhost:8080/api/complaints/${id}/response?response=${response}`,

{
method:"PUT"
}

);

loadComplaints();

}

async function updateStatus(
id,status){

await fetch(

`http://localhost:8080/api/complaints/${id}?status=${status}`,

{
method:"PUT"
}

);

loadComplaints();

}

async function loadComplaints(){

const response=
await fetch(
"http://localhost:8080/api/complaints"
);

const data=
await response.json();

document.getElementById(
"total"
).innerText=
data.length;

document.getElementById(
"pending"
).innerText=
data.filter(
c=>c.status==="Pending"
).length;

document.getElementById(
"progress"
).innerText=
data.filter(
c=>c.status==="In Progress"
).length;

document.getElementById(
"resolved"
).innerText=
data.filter(
c=>c.status==="Resolved"
).length;

const search=
document
.getElementById(
"search")
.value
.toLowerCase();

const status=
document
.getElementById(
"statusFilter")
.value;

const filtered=
data.filter(c=>{

const title=
String(
c.title||""
)
.toLowerCase();

return(

title.includes(search)

&&

(
status===""
||
c.status===status
)

);

});

let output="";

filtered.forEach(c=>{

output +=`

<div class="card">

<h2>

${c.title}

</h2>

<p>

${c.description}

</p>

<p>

User:
<b>

${c.user
?
c.user.name
:
"Anonymous"}

</b>

</p>

<p>

Status:
<b>

${c.status}

</b>

</p>

<p>

Image:

</p>

${
c.imageName ?

`<img
src="http://localhost:8080/uploads/${c.imageName}"
width="250">`

:

"No image"

}

<p>

Admin Response:
<b>

${c.adminResponse
||
"No response"}

</b>

</p>

<textarea
id="response${c.id}"
placeholder=
"Write response">

</textarea>

<br>

<button
onclick=
"sendResponse(${c.id})">

Send Response

</button>

<button
onclick=
"updateStatus(${c.id},
'In Progress')">

In Progress

</button>

<button
onclick=
"updateStatus(${c.id},
'Resolved')">

Resolved

</button>

</div>

`;

});

document
.getElementById(
"complaints"
)
.innerHTML=
output;

}

document
.getElementById(
"search"
)
.addEventListener(
"input",
loadComplaints
);

document
.getElementById(
"statusFilter"
)
.addEventListener(
"change",
loadComplaints
);

loadComplaints();

</script>

</body>
</html>
