<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

h1{
margin-bottom:20px;
}

/* Analytics cards */

.stats{

display:flex;

gap:20px;

flex-wrap:wrap;

margin-bottom:30px;

}

.stat-card{

background:white;

padding:20px;

width:180px;

border-radius:10px;

box-shadow:0px 2px 8px gray;

text-align:center;

}

.number{

font-size:30px;

font-weight:bold;

margin-top:10px;

}

/* Complaint cards */

.card{

background:white;

padding:20px;

margin:15px 0;

border-radius:10px;

box-shadow:0px 2px 8px gray;

}

button{

padding:10px;

margin:5px;

cursor:pointer;

border:none;

border-radius:5px;

}

input,select{

padding:10px;

margin:10px;

width:220px;

}

.status{

font-weight:bold;

}

.user{

color:blue;

}

.empty{

padding:20px;

font-size:20px;

color:gray;

}

</style>

</head>

<body>

<h1>Admin Dashboard</h1>

<!-- Dashboard analytics -->

<div class="stats">

<div class="stat-card">

<h3>Total</h3>

<div
class="number"
id="total">

0

</div>

</div>

<div class="stat-card">

<h3>Pending</h3>

<div
class="number"
id="pending">

0

</div>

</div>

<div class="stat-card">

<h3>In Progress</h3>

<div
class="number"
id="progress">

0

</div>

</div>

<div class="stat-card">

<h3>Resolved</h3>

<div
class="number"
id="resolved">

0

</div>

</div>

</div>

<input
id="search"
placeholder="Search title">

<select
id="statusFilter">

<option value="">
All
</option>

<option value="Pending">
Pending
</option>

<option value="In Progress">
In Progress
</option>

<option value="Resolved">
Resolved
</option>

</select>

<div id="complaints">

Loading...

</div>

<script>

async function loadComplaints(){

try{

const response=
await fetch(
"http://localhost:8080/api/complaints"
);

const data=
await response.json();


// Analytics

const total=
data.length;

const pending=
data.filter(
c=>c.status==="Pending"
).length;

const progress=
data.filter(
c=>c.status==="In Progress"
).length;

const resolved=
data.filter(
c=>c.status==="Resolved"
).length;

document
.getElementById(
"total")
.innerText=
total;

document
.getElementById(
"pending")
.innerText=
pending;

document
.getElementById(
"progress")
.innerText=
progress;

document
.getElementById(
"resolved")
.innerText=
resolved;


// Search

const search=
document
.getElementById(
"search")
.value
.toLowerCase();

const status=
document
.getElementById(
"statusFilter")
.value;


const filtered=
data.filter(c=>{

const title=
(c.title||"")
.toLowerCase();

const matchTitle=
title.includes(
search);

const matchStatus=

status===""

||

c.status===status;

return matchTitle
&&
matchStatus;

});


let output="";

if(filtered.length===0){

output=`

<div class="empty">

No complaints found

</div>

`;

}

filtered.forEach(c=>{

output +=`

<div class="card">

<h2>

${c.title}

</h2>

<p>

${c.description}

</p>

<p>

Category:

<b>

${c.category}

</b>

</p>

<p>

Attachment:

<b>

${c.imageName
||
"No file"}

</b>

</p>

<p>

User:

<span class="user">

${c.user
? c.user.name
: "Anonymous"}

</span>

</p>

<p>

Status:

<span class="status">

${c.status}

</span>

</p>

<button
onclick=
"updateStatus(
${c.id},
'In Progress'
)">

In Progress

</button>

<button
onclick=
"updateStatus(
${c.id},
'Resolved'
)">

Resolved

</button>

</div>

`;

});

document
.getElementById(
"complaints"
)
.innerHTML=
output;

}catch(error){

console.log(error);

document
.getElementById(
"complaints"
)
.innerHTML=
"<h2>Error loading complaints</h2>";

}

}

async function
updateStatus(
id,
status){

await fetch(

`http://localhost:8080/api/complaints/${id}?status=${status}`,

{
method:"PUT"
}

);

loadComplaints();

}

document
.getElementById(
"search")
.addEventListener(
"input",
loadComplaints
);

document
.getElementById(
"statusFilter")
.addEventListener(
"change",
loadComplaints
);

loadComplaints();

</script>

</body>
</html>
