<!DOCTYPE html>
<html>

<head>
<title>Login</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:40px;
}

.container{

background:white;

width:350px;

margin:auto;

padding:30px;

border-radius:10px;

box-shadow:
0px 2px 10px gray;

}

input{

width:100%;

padding:10px;

margin-top:10px;

margin-bottom:20px;

}

button{

width:100%;

padding:10px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>Login</h1>

<input
id="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
onclick=
"login()">

Login

</button>

</div>

<script>

async function login(){

const data={

email:
document
.getElementById(
"email")
.value,

password:
document
.getElementById(
"password")
.value

};

const response=
await fetch(

"http://localhost:8080/api/auth/login",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(
data)

}

);

const user=
await response.json();

if(user){

localStorage
.setItem(
"userId",
user.id
);

localStorage
.setItem(
"userName",
user.name
);

localStorage
.setItem(
"role",
user.role
);

alert(
"Login Success"
);

if(
user.role
==="ADMIN"
){

window.location=
"admin.html";

}

else{

window.location=
"index.html";

}

}

else{

alert(
"Invalid Login"
);

}

}

</script>

</body>
</html>
