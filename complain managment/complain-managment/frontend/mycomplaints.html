<!DOCTYPE html>
<html>

<head>

<title>
My Complaints
</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px;
border-radius:10px;
box-shadow:0px 2px 8px gray;
}

</style>

</head>

<body>

<h1>

My Complaints

</h1>

<div id="complaints">

Loading...

</div>

<script>

async function
loadComplaints(){

const userId=

localStorage
.getItem(
"userId"
);

const response=

await fetch(

`http://localhost:8080/api/complaints/user/${userId}`

);

const data=

await response
.json();

let output="";

if(data.length===0){

output=
"<h2>No complaints found</h2>";

}

data.forEach(c=>{

output +=`

<div class="card">

<h2>

${c.title}

</h2>

<p>

${c.description}

</p>

<p>

Status:
<b>

${c.status}

</b>

</p>

<p>

Attachment:

${c.imageName
||
"No file"}

</p>

<p>

Admin Response:

<b>

${c.adminResponse
||
"No response"}

</b>

</p>

<p>

Created:

${c.createdAt}

</p>

</div>

`;

});

document
.getElementById(
"complaints"
)
.innerHTML=
output;

}

loadComplaints();

</script>

</body>
</html>
