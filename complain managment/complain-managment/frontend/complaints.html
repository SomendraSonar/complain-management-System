<!DOCTYPE html>
<html>
<head>
    <title>All Complaints</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:20px;
}

.card{

background:white;

padding:15px;

margin:10px;

border-radius:10px;

box-shadow:
0 2px 5px gray;

}

</style>

</head>

<body>

<h1>Complaint List</h1>

<div id="complaintList"></div>

<script>

async function loadComplaints(){

const response=
await fetch(
"http://localhost:8080/api/complaints"
);

const data=
await response.json();

let output="";

data.forEach(c=>{

output +=`

<div class="card">

<h3>${c.title}</h3>

<p>${c.description}</p>

<p>Status:
${c.status}</p>

<p>Category:
${c.category}</p>

</div>

`;

});

document
.getElementById(
"complaintList")
.innerHTML=output;

}

loadComplaints();

</script>

</body>
</html>
