<!doctype html>
<html>
  <head>
    <title>Create Complaint</title>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef2ff, #dbeafe);

        min-height: 100vh;

        padding: 30px;
      }

      nav {
        background: white;

        padding: 18px;

        border-radius: 18px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 30px;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #4f46e5;
      }

      nav a {
        text-decoration: none;

        margin-left: 20px;

        font-weight: bold;

        color: #333;
      }

      .container {
        max-width: 700px;

        margin: auto;

        background: white;

        padding: 35px;

        border-radius: 25px;

        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-bottom: 20px;

        color: #333;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;

        padding: 15px;

        border: 1px solid #ddd;

        border-radius: 12px;

        outline: none;

        font-size: 15px;
      }

      textarea {
        height: 140px;

        resize: none;
      }

      .counter {
        font-size: 13px;

        text-align: right;

        color: gray;

        margin-top: 5px;
      }

      .upload-box {
        border: 2px dashed #bbb;

        padding: 25px;

        border-radius: 15px;

        text-align: center;

        background: #fafafa;

        cursor: pointer;
      }

      .upload-box:hover {
        border-color: #4f46e5;
      }

      #preview {
        margin-top: 20px;

        max-width: 220px;

        display: none;

        border-radius: 12px;
      }

      button {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 12px;

        background: #4f46e5;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
      }

      button:hover {
        background: #3730a3;
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="logo">Complaint Portal</div>

      <div>
        <a href="index.html"> Create </a>

        <a href="mycomplaints.html"> My Complaints </a>

        <a href="admin.html"> Dashboard </a>
      </div>
    </nav>

    <div class="container">
      <h1>Create Complaint</h1>

      <div class="input-group">
        <label> Complaint Title </label>

        <input id="title" placeholder="Enter title" />
      </div>

      <div class="input-group">
        <label> Description </label>

        <textarea
          id="description"
          placeholder="Describe issue..."
          oninput="countText()"
        >
        </textarea>

        <div class="counter" id="count">0/300</div>
      </div>

      <div class="input-group">
        <label> Upload Image </label>

        <label class="upload-box">
          <i class="fa-solid fa-cloud-arrow-up"> </i>

          <br /><br />

          Choose complaint image

          <input type="file" id="image" hidden />
        </label>

        <img id="preview" />
      </div>

      <button id="submitBtn" onclick="submitComplaint()">
        Submit Complaint
      </button>
    </div>

    <script src="complaint.js"></script>

    <script>
      function countText() {
        let len = document.getElementById("description").value.length;

        document.getElementById("count").innerHTML = len + "/300";
      }

      document
        .getElementById("image")

        .addEventListener(
          "change",

          function () {
            const file = this.files[0];

            if (file) {
              const img = document.getElementById("preview");

              img.src = URL.createObjectURL(file);

              img.style.display = "block";
            }
          },
        );
    </script>
  </body>
</html>
