<!doctype html>
<html>
<head>
<title>My Complaints</title>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#dbeafe);
padding:30px;
min-height:100vh;
}

nav{
background:white;
padding:18px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
margin-bottom:30px;
}

.logo{
font-size:24px;
font-weight:bold;
color:#4f46e5;
}

nav a{
text-decoration:none;
margin-left:20px;
font-weight:bold;
color:#333;
}

nav a:hover{
color:#4f46e5;
}

h1{
margin-bottom:25px;
color:#333;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card h2{
margin-bottom:10px;
color:#333;
}

.badge{
padding:8px 14px;
border-radius:20px;
color:white;
font-size:14px;
font-weight:bold;
display:inline-block;
margin-top:10px;
}

.Pending{
background:orange;
}

.Resolved{
background:green;
}

.InProgress{
background:#2563eb;
}

img{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:12px;
margin-top:15px;
}

.response{
background:#f5f5f5;
padding:10px;
margin-top:15px;
border-radius:10px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#4f46e5;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3730a3;
}

.empty{
text-align:center;
margin-top:100px;
font-size:22px;
color:gray;
}

.date{
margin-top:15px;
font-size:13px;
color:gray;
}

</style>

</head>

<body>

<nav>

<div class="logo">
Complaint Portal
</div>

<div>

<a href="create.html">
Create
</a>

<a href="mycomplaints.html">
My Complaints
</a>

<a href="admin.html">
Dashboard
</a>

</div>

</nav>

<h1>
My Complaints
</h1>

<div id="complaints" class="grid">
Loading...
</div>

<script>

async function loadComplaints(){

const userId=
localStorage.getItem(
"userId"
);

try{

const response=
await fetch(

`${window.location.origin}/api/complaints/user/${userId}`

);

if(!response.ok){

throw new Error();

}

const data=
await response.json();

let output="";

if(data.length===0){

output=`

<div class="empty">

<i class="fa-solid fa-folder-open"></i>

<br><br>

No Complaints Found

</div>

`;

}

data.forEach((c)=>{

let badgeClass=
c.status.replace(" ","");

output+=`

<div class="card">

<h2>

${c.title}

</h2>

<p>

${c.description}

</p>

<div class="badge ${badgeClass}">

${c.status}

</div>

${
c.imageName?

`<img src="${window.location.origin}/uploads/${c.imageName}">`

:""
}

<div class="response">

<b>

Admin Response:

</b>

<br>

${c.adminResponse || "No response yet"}

</div>

<div class="date">

Created:

${new Date(
c.createdAt
).toLocaleString()}

</div>

<button

onclick=

"window.open(
'${window.location.origin}/api/complaints/${c.id}/pdf'
)"

>

<i class="fa-solid fa-download"></i>

Download PDF

</button>

</div>

`;

});

document.getElementById(
"complaints"
).innerHTML=output;

}catch(error){

console.log(error);

document.getElementById(
"complaints"
).innerHTML=`

<div class="empty">

Error loading complaints

</div>

`;

}

}

loadComplaints();

</script>

</body>
</html>
