<!DOCTYPE html>
<html>
<head>
    <title>Complaint Portal</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#4f46e5,
#7c3aed,
#06b6d4
);

overflow:hidden;

color:white;

}

.background{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.1);
animation:float 8s infinite linear;
}

.circle:nth-child(1){
width:250px;
height:250px;
top:10%;
left:10%;
}

.circle:nth-child(2){
width:350px;
height:350px;
bottom:5%;
right:5%;
}

.circle:nth-child(3){
width:150px;
height:150px;
top:65%;
left:25%;
}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-30px);
}

100%{
transform:translateY(0);
}

}

.container{

position:relative;

width:450px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

box-shadow:
0 10px 35px rgba(0,0,0,.3);

text-align:center;

z-index:10;

animation:fadeIn 1s ease;

}

.logo{

font-size:70px;

margin-bottom:15px;

}

h1{

font-size:35px;

margin-bottom:10px;

}

p{

opacity:.9;

line-height:1.6;

margin-bottom:20px;

}

.loader{

margin:auto;

width:45px;
height:45px;

border:4px solid rgba(255,255,255,.3);

border-top:4px solid white;

border-radius:50%;

animation:spin 1s linear infinite;

}

.credit{

position:absolute;

bottom:15px;

right:20px;

font-size:14px;

opacity:.8;

background:rgba(255,255,255,.12);

padding:8px 14px;

border-radius:20px;

backdrop-filter:blur(10px);

}

.credit i{

margin-right:6px;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="container">

<div class="logo">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h1>Complaint Portal</h1>

<p>
Welcome to Complaint Management System
<br><br>
Redirecting to secure login...
</p>

<div class="loader"></div>

</div>

<div class="credit">

<i class="fa-solid fa-code"></i>

Made by <b>Somendra Sonar</b>

</div>

<script>

setTimeout(()=>{

window.location.href=
"login.html";

},2500);

</script>

</body>
</html>
