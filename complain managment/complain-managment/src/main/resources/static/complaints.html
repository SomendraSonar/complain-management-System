<!doctype html>
<html>
<head>
<title>All Complaints</title>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#eef2ff,#dbeafe);
padding:30px;
min-height:100vh;
}

nav{
background:white;
padding:18px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
margin-bottom:30px;
}

.logo{
font-size:24px;
font-weight:bold;
color:#4f46e5;
}

nav a{
text-decoration:none;
margin-left:20px;
font-weight:bold;
color:#333;
}

nav a:hover{
color:#4f46e5;
}

.user-box{

display:flex;
align-items:center;
gap:15px;

}

.user-name{

font-weight:bold;
color:#4f46e5;

}

.logout{

background:#ef4444;
padding:10px 15px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;

}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.search{
padding:12px;
width:300px;
border:none;
border-radius:12px;
outline:none;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card h2{
margin-bottom:10px;
color:#333;
}

.badge{
display:inline-block;
padding:8px 15px;
border-radius:20px;
font-size:14px;
font-weight:bold;
color:white;
margin-top:10px;
}

.Pending{
background:orange;
}

.Resolved{
background:green;
}

.InProgress{
background:#2563eb;
}

.category{
margin-top:12px;
padding:8px;
background:#f3f4f6;
border-radius:10px;
display:inline-block;
}

img{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:12px;
margin-top:15px;
}

.date{
margin-top:15px;
font-size:13px;
color:gray;
}

.empty{
text-align:center;
font-size:25px;
color:gray;
margin-top:80px;
}

</style>

</head>

<body>

<script>

const userId=
localStorage.getItem(
"userId"
);

if(!userId){

alert(
"Please login first"
);

window.location.href=
"login.html";

}

</script>

<nav>

<div class="logo">
Complaint Portal
</div>

<div>

<a href="create.html">
Create
</a>

<a href="mycomplaints.html">
My Complaints
</a>

<a
id="dashboardLink"
href="admin.html">

Dashboard

</a>

</div>

<div class="user-box">

<div class="user-name">

👤
<span id="username">

</span>

</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</nav>

<div class="header">

<h1>
All Complaints
</h1>

<input
class="search"
id="search"
placeholder="Search complaints..."
oninput="loadComplaints()"
/>

</div>

<div
id="complaintList"
class="grid">

Loading...

</div>

<script>

document.getElementById(
"username"
).innerText=

localStorage.getItem(
"userName"
);

if(
localStorage.getItem(
"role"
)!=="ADMIN"
){

document.getElementById(
"dashboardLink"
).style.display=
"none";

}

function logout(){

localStorage.clear();

window.location.href=
"login.html";

}


async function loadComplaints(){

try{

const response=

await fetch(
`${window.location.origin}/api/complaints`
);

if(!response.ok){

throw new Error();

}

const data=
await response.json();

const search=

document
.getElementById(
"search"
)

.value

.toLowerCase();

let output="";

const filtered=

data.filter((c)=>

String(
c.title||""
)

.toLowerCase()

.includes(
search
)

);


if(filtered.length===0){

output=`

<div class="empty">

<i class=
"fa-solid fa-folder-open">

</i>

<br><br>

No Complaints Found

</div>

`;

}


filtered.forEach((c)=>{

let badgeClass=

String(
c.status
)

.replace(
" ",
""
);

output+=`

<div class="card">

<h2>

${c.title}

</h2>

<p>

${c.description}

</p>

<div
class=
"badge ${badgeClass}">

${c.status}

</div>

<div class=
"category">

📁

${c.category||"General"}

</div>

${
c.imageName
?
`<img src="${window.location.origin}/uploads/${c.imageName}">`
:
""
}

<div class="date">

Created:

${
c.createdAt
?

new Date(
c.createdAt
)

.toLocaleString()

:

"Unknown"

}

</div>

</div>

`;

});

document.getElementById(
"complaintList"
).innerHTML=
output;

}catch(error){

console.log(error);

document.getElementById(
"complaintList"
)

.innerHTML=

`<div class="empty">

Error loading complaints

</div>`;

}

}

loadComplaints();

</script>

</body>
</html>
