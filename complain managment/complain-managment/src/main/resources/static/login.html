<!doctype html>
<html>
<head>
    <title>Complaint System Login</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#4f46e5,
#7c3aed,
#06b6d4
);

overflow:hidden;

}

.background{

position:absolute;
width:100%;
height:100%;
overflow:hidden;

}

.circle{

position:absolute;
border-radius:50%;
background:rgba(255,255,255,.1);

animation:float 8s infinite linear;

}

.circle:nth-child(1){

width:250px;
height:250px;

top:10%;
left:10%;

}

.circle:nth-child(2){

width:350px;
height:350px;

bottom:5%;
right:5%;

}

.circle:nth-child(3){

width:150px;
height:150px;

top:65%;
left:25%;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-30px);
}

100%{
transform:translateY(0px);
}

}

.container{

position:relative;

width:400px;

padding:35px;

border-radius:25px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

box-shadow:
0 10px 35px rgba(0,0,0,.3);

color:white;

z-index:100;

}

.logo{

font-size:60px;

text-align:center;

margin-bottom:10px;

}

h1{

text-align:center;

margin-bottom:10px;

}

.subtitle{

text-align:center;

margin-bottom:25px;

opacity:.8;

}

.input-box{

position:relative;

margin-top:18px;

}

.input-box i{

position:absolute;

left:15px;

top:16px;

color:#555;

}

.input-box input{

width:100%;

padding:14px 14px 14px 45px;

border:none;

border-radius:12px;

outline:none;

font-size:15px;

}

.password-toggle{

position:absolute;

right:15px;

top:16px;

cursor:pointer;

color:#555;

}

button{

width:100%;

padding:14px;

margin-top:25px;

border:none;

border-radius:12px;

background:#4f46e5;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#3730a3;

transform:translateY(-2px);

}

.footer{

margin-top:25px;

text-align:center;

}

.footer a{

color:white;

font-weight:bold;

text-decoration:none;

}

.footer a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="container">

<div class="logo">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h1>Complaint Portal</h1>

<p class="subtitle">
Secure Login System
</p>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
id="email"
placeholder="Email"
/>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
id="password"
type="password"
placeholder="Password"
/>

<i
class="fa-solid fa-eye password-toggle"
onclick="togglePassword()">
</i>

</div>

<button
id="loginBtn"
onclick="login()">

Login

</button>

<div class="footer">

New User?

<a href="register.html">

Register Here

</a>

</div>

</div>

<script>

function togglePassword(){

let pass=
document.getElementById(
"password"
);

if(
pass.type==="password"
){

pass.type="text";

}else{

pass.type="password";

}

}

async function login(){

const btn=
document.getElementById(
"loginBtn"
);

btn.innerHTML=
"Logging in...";

btn.disabled=true;

const data={

email:
document.getElementById(
"email"
).value,

password:
document.getElementById(
"password"
).value

};

try{

const response=
await fetch(

`${window.location.origin}/api/auth/login`,

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(data)

}

);

if(!response.ok){

throw new Error();

}

const user=
await response.json();

localStorage.setItem(
"userId",
user.id
);

localStorage.setItem(
"userName",
user.name
);

localStorage.setItem(
"role",
user.role
);

if(
user.role==="ADMIN"
){

window.location=
"admin.html";

}else{

window.location=
"create.html";

}

}catch{

alert(
"Invalid Email or Password"
);

btn.innerHTML=
"Login";

btn.disabled=false;

}

}

</script>

</body>
</html>
